{% extends "base.html" %}
{% block title %}Setup | Simply Bookkeeping{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-block mb-3">
        <img src="/static/img/simply-bookkeeping-logo.png" alt="Simply Bookkeeping" class="h-16 w-auto mx-auto" />
      </div>
      <h1 class="font-display text-2xl font-semibold text-ink">Welcome to Simply Bookkeeping</h1>
      <p class="text-ink/50 text-sm mt-1">Let's set up your owner login. You can add additional accounts later in Settings.</p>
    </div>

    <form method="post" action="/setup" class="bg-papercard border border-line rounded-lg p-8 space-y-5">
      {% if error %}
      <div class="text-sm text-rust bg-rustlight/40 border border-rust/30 rounded px-3 py-2">{{ error }}</div>
      {% endif %}
      <div>
        <label class="block text-xs uppercase tracking-wide text-ink/50 mb-1.5">Choose a username</label>
        <input name="username" type="text" required autofocus
          class="w-full border border-line rounded px-3 py-2 bg-white text-ink" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wide text-ink/50 mb-1.5">Choose a password</label>
        <input name="password" type="password" required
          class="w-full border border-line rounded px-3 py-2 bg-white text-ink" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wide text-ink/50 mb-1.5">Confirm password</label>
        <input name="confirm_password" type="password" required
          class="w-full border border-line rounded px-3 py-2 bg-white text-ink" />
      </div>
      <button type="submit" class="w-full bg-accent text-white rounded py-2.5 font-medium hover:bg-accentdeep transition-colors">
        Create account &amp; continue
      </button>
    </form>
  </div>
</div>
{% endblock %}
